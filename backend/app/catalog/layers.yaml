  - id: valley_networks
    name: "Valley networks (Hynek et al. 2010)"
    description: >-
      Global map of ancient valley networks carved by liquid water,
      manually mapped on THEMIS day IR and MOLA (Hynek, Beach & Hoke 2010).
      Mostly Noachian (> ~3.7 Ga): evidence of an early wetter climate.
    group: overlay
    category: hydrology
    format: png
    tile_size: 256
    levels: { min: 0, max: 8 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 1.0
    z_index: 70
    attribution: "Valley networks: Hynek et al. 2010 · via NASA Mars Trek"
    legend:
      type: symbol
      title: "Valley networks"
      quantitative: true
      stops:
        - { color: "#ffffff", label: "Mapped valley (line)" }
      notes:
        - "Lines are ancient, dry valleys. They are scientific targets (past water), not present-day water sources."
      sources:
        - { name: "Hynek, Beach & Hoke (2010), JGR 115, E09008", url: "https://doi.org/10.1029/2009JE003548" }
    source:
      url_template: "https://trek.nasa.gov/mars/trekarcgis/rest/services/Hynek_Valley_Networks/MapServer/WMTS/tile/1.0.0/Hynek_Valley_Networks/default/default028mm/{z}/{y}/{x}.png"
