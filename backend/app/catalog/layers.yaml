# =====================================================================
#  ARTURO LAYER CATALOG
# =====================================================================
#  This file is the SINGLE source of truth about which layers exist.
#  The frontend knows nothing about NASA: it asks GET /api/layers for
#  the list and renders whatever is here. Adding/changing a layer =
#  editing this YAML (and, for a new kind of source, checking that the
#  provider understands it).
#
#  Tile grid (shared by every layer)
#  ---------------------------------
#  Equirectangular projection ("flat" lat/lon, EPSG:4326-like) with the
#  origin at the top-left corner (-180, 90). At level 0 the planet is
#  2 tiles wide x 1 tile tall; every level doubles both numbers.
#  This is exactly NASA Mars Trek's WMTS "default028mm" scheme.
#
#  Fields of each layer
#  --------------------
#  id            Unique identifier (goes in the URL: /api/tiles/{id}/...)
#  name          Name shown in the UI
#  description   Descriptive text for the UI / docs
#  group         "base"    -> imagery the rest is drawn on (bottom of the
#                             stack; on by default but can be toggled)
#                "overlay" -> thematic layers drawn on top of the base
#  category      Thematic group for the layer control: imagery |
#                topography | thermal | surface | composition |
#                geology | hydrology
#  default_visible  Shown when the app starts (user can toggle freely)
#  blend_mode    normal | multiply | screen | overlay (CSS mix-blend-mode).
#                "multiply" makes a greyscale hillshade shade the layers
#                underneath instead of hiding them.
#  coverage      {south, west, north, east} with data; no tiles are
#                requested outside it (default: whole planet)
#  resolution_m  Approximate native resolution (metres/pixel), for the UI
#  legend        How to READ the layer (see "Legends" below)
#  format        Tile file extension: jpg | png
#  tile_size     Pixel size of each source tile (256 or 512)
#  levels        NATIVE source levels {min, max}. Above the max, the
#                viewer upscales the last available tile.
#  display       MAP zoom range where the layer is shown {min_zoom, max_zoom}
#  opacity       0..1
#  z_index       Stacking order (higher = on top)
#  attribution   Mandatory data credits
#  transform     Optional post-processing applied by the backend:
#                  nodata_to_transparent: true -> pure black pixels
#                  (gaps with no data) become transparent so the layer
#                  underneath shows through.
#  source        ONLY used by the backend in remote mode (never exposed):
#                  url_template with {z} (level), {x} (column), {y} (row)
#
#  Legends
#  -------
#  type          gradient    -> colour ramp (stops from low to high)
#                categorical -> one colour per class (e.g. geologic units)
#                channels    -> meaning of each RGB channel
#                symbol      -> what the drawn symbols mean (e.g. lines)
#  title, units  Header of the legend
#  quantitative  true ONLY if the colour->value mapping is documented.
#                Otherwise the legend is a qualitative guide and the UI
#                says so. We never invent numbers.
#  min_label / max_label  Text at both ends of a gradient
#  stops         [{color: "#rrggbb", label, value}]
#  notes         Short interpretation hints (one line each)
#  sources       [{name, url}] where the interpretation comes from
#
#  Colour stops of gradient legends were SAMPLED from the published
#  tiles themselves (hue-sorted), so they match what is on screen.
#  =====================================================================

layers:
  # -------------------------------------------------------------------
  # Global colour base: Viking MDIM 2.1 (~232 m/pixel)
  # Covers the WHOLE planet (poles included); it is what you see when
  # zoomed out. Native levels 0-7; beyond that it is upscaled under CTX.
  # -------------------------------------------------------------------
  - id: viking_mdim21_color
    name: "Viking MDIM 2.1 (colour, global)"
    description: >-
      Global colour mosaic from the Viking orbiters (USGS MDIM 2.1),
      ~232 m/pixel. Full planetary coverage.
    group: base
    category: imagery
    default_visible: true
    resolution_m: 232
    format: jpg
    tile_size: 256
    levels: { min: 0, max: 7 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 1.0
    z_index: 1
    attribution: "Viking MDIM 2.1: NASA/JPL/USGS · via NASA Mars Trek"
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_Viking_MDIM21_ClrMosaic_global_232m/1.0.0/default/default028mm/{z}/{y}/{x}.jpg"

  # -------------------------------------------------------------------
  # Detail: global CTX mosaic (~5 m/pixel, greyscale)
  # Covers ~99 % of the planet between ±88° latitude, with some gaps.
  # Mars Trek publishes it in its WMTS pointing to Esri's service
  # (astro.arcgis.com, in collaboration with Caltech's Murray Lab).
  # 512 px tiles, native levels 0-12 (level 12 ≈ 5 m/pixel).
  # Only shown at high zoom: at low zoom the mosaic is normalised
  # (flat grey) and the Viking colour mosaic looks much better.
  # -------------------------------------------------------------------
  - id: ctx_global_5m
    name: "CTX global (5 m/pixel)"
    description: >-
      Global mosaic from the CTX camera (Mars Reconnaissance Orbiter),
      ~5 m/pixel, greyscale. No-data gaps are made transparent.
    group: base
    category: imagery
    default_visible: true
    resolution_m: 5
    coverage: { south: -88, west: -180, north: 88, east: 180 }
    format: png
    tile_size: 512
    levels: { min: 0, max: 12 }
    display: { min_zoom: 7, max_zoom: 18 }
    opacity: 1.0
    z_index: 2
    attribution: "CTX: NASA/JPL/MSSS/Caltech Murray Lab/Esri · via NASA Mars Trek"
    transform:
      nodata_to_transparent: true
    source:
      url_template: "https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX/MapServer/tile/{z}/{y}/{x}"

  # =====================================================================
  #  OVERLAYS — thematic global layers from NASA Mars Trek
  #  ---------------------------------------------------------------------
  #  All verified against each product's WMTSCapabilities.xml
  #  (https://trek.nasa.gov/tiles/Mars/EQ/{product}/1.0.0/WMTSCapabilities.xml):
  #  same default028mm 2:1 equirectangular grid as the base layers, so
  #  they align pixel-for-pixel. Stacking (z_index), bottom -> top:
  #    10-19 topography colour   20-29 thermal   30-39 surface
  #    40-49 composition         50-59 geology   60-69 shading
  #    70-79 line/point overlays (hydrology)
  # =====================================================================

  # -------------------------------------------------------------------
  # TOPOGRAPHY
  # -------------------------------------------------------------------
  - id: mola_hrsc_color_hillshade
    name: "Elevation, colour (MOLA + HRSC, 200 m)"
    description: >-
      Colour-coded elevation with hillshading, from the blended MOLA
      (Mars Global Surveyor) and HRSC (Mars Express) digital terrain model,
      ~200 m/pixel. Colour = height, shading = relief.
    group: overlay
    category: topography
    resolution_m: 200
    format: jpg
    tile_size: 256
    levels: { min: 0, max: 8 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.85
    z_index: 11
    attribution: "MOLA/HRSC blend: NASA/JPL/GSFC/ESA/DLR/FU Berlin/USGS · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Elevation above the areoid"
      units: "km"
      quantitative: false
      min_label: "Lowest (≈ −8 km, Hellas floor)"
      max_label: "Highest (≈ +21 km, Olympus Mons)"
      stops:
        - { color: "#4b1b91" }
        - { color: "#1b30a3" }
        - { color: "#1b6ca4" }
        - { color: "#1c9689" }
        - { color: "#2da124" }
        - { color: "#90b21d" }
        - { color: "#b2782f" }
        - { color: "#993b33" }
        - { color: "#e8e8e8" }
      notes:
        - "Purple/blue = low basins and northern plains; green/yellow = mid elevations; red/brown = high plateaus; white = volcano summits."
        - "Brightness also varies with the hillshade (sun-facing slopes look lighter)."
        - "The published tiles do not document exact colour stops: the end values are the known extremes of Mars, not a calibrated scale. Exact heights will come from the DEM (point query, phase 2)."
      sources:
        - { name: "NASA Mars Trek product: MGS MOLA and Mars Express HRSC, Color Hillshade Blend", url: "https://trek.nasa.gov/mars/" }
        - { name: "Smith et al. (2001), MOLA summary, JGR 106(E10)", url: "https://doi.org/10.1029/2000JE001364" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MOLA_blend200ppx_HRSC_ClrShade_clon0dd_200mpp_lzw/1.0.0/default/default028mm/{z}/{y}/{x}.jpg"

  - id: mola_color_hillshade
    name: "Elevation, colour (MOLA, 463 m)"
    description: >-
      The classic MOLA colour hillshade (Mars Global Surveyor laser
      altimeter, 128 pixels/degree ≈ 463 m/pixel). Brighter palette than
      the MOLA+HRSC blend; same meaning.
    group: overlay
    category: topography
    resolution_m: 463
    format: jpg
    tile_size: 256
    levels: { min: 0, max: 7 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.85
    z_index: 10
    attribution: "MOLA: NASA/JPL/GSFC · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Elevation above the areoid"
      units: "km"
      quantitative: false
      min_label: "Lowest (≈ −8 km, Hellas floor)"
      max_label: "Highest (≈ +21 km, Olympus Mons)"
      stops:
        - { color: "#5c39b1" }
        - { color: "#3442c7" }
        - { color: "#3996cf" }
        - { color: "#41caba" }
        - { color: "#51d34f" }
        - { color: "#cded4a" }
        - { color: "#e7a859" }
        - { color: "#c35850" }
        - { color: "#f2f2f2" }
      notes:
        - "Purple/blue = low, green/yellow = middle, red/brown = high, white = highest summits."
        - "Qualitative ramp: exact colour stops are not published with the tiles."
      sources:
        - { name: "NASA Mars Trek product: MGS MOLA, Global Color Hillshade", url: "https://trek.nasa.gov/mars/" }
        - { name: "Smith et al. (2001), MOLA summary, JGR 106(E10)", url: "https://doi.org/10.1029/2000JE001364" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MGS_MOLA_ClrShade_merge_global_463m/1.0.0/default/default028mm/{z}/{y}/{x}.jpg"

  - id: mola_hrsc_hillshade
    name: "Shaded relief (MOLA + HRSC, 200 m)"
    description: >-
      Greyscale hillshade of the blended MOLA + HRSC terrain model. Drawn
      in 'multiply' mode, so it adds relief shading to whatever layers are
      underneath (imagery, thermal, geology...).
    group: overlay
    category: topography
    resolution_m: 200
    blend_mode: multiply
    format: jpg
    tile_size: 256
    levels: { min: 0, max: 8 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.7
    z_index: 60
    attribution: "MOLA/HRSC blend: NASA/JPL/GSFC/ESA/DLR/FU Berlin/USGS · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Shaded relief (artificial illumination)"
      quantitative: false
      min_label: "Slope facing away from the light"
      max_label: "Slope facing the light / flat"
      stops:
        - { color: "#3a3a3a" }
        - { color: "#9a9a9a" }
        - { color: "#f0f0f0" }
      notes:
        - "Shows the SHAPE of the terrain (relief), not its height or colour."
        - "Combine it with any other layer: it only darkens, never hides."
      sources:
        - { name: "NASA Mars Trek product: MGS MOLA and Mars Express HRSC, Hillshade Blend", url: "https://trek.nasa.gov/mars/" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MOLA_blend200ppx_HRSC_Shade_clon0dd_200mpp_lzw/1.0.0/default/default028mm/{z}/{y}/{x}.jpg"

  # -------------------------------------------------------------------
  # THERMAL
  # There is NO real-time temperature map of Mars. These layers are
  # orbital thermal-infrared mosaics: they show RELATIVE surface
  # temperature at the time of the observations (and, at night, the
  # thermal inertia behind it). Estimated temperature for a given
  # season/hour will come from the Mars Climate Model (phase 2).
  # -------------------------------------------------------------------
  - id: themis_day_ir
    name: "Thermal IR, daytime (THEMIS, 100 m)"
    description: >-
      Daytime thermal-infrared mosaic from THEMIS (Mars Odyssey), controlled
      to MDIM 2.1, ~100 m/pixel, between 65°S and 65°N. Brightness =
      relative surface temperature in the afternoon; it mostly reveals
      topography (sun-facing slopes are warmer).
    group: overlay
    category: thermal
    resolution_m: 100
    coverage: { south: -65, west: -180, north: 65, east: 180 }
    format: png
    tile_size: 256
    levels: { min: 0, max: 9 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 1.0
    z_index: 20
    attribution: "THEMIS Day IR: NASA/JPL/ASU (Edwards et al. 2011; USGS 2018 controlled mosaic) · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Relative daytime surface temperature"
      quantitative: false
      min_label: "Cooler (dark)"
      max_label: "Warmer (bright)"
      stops:
        - { color: "#101010" }
        - { color: "#808080" }
        - { color: "#f5f5f5" }
      notes:
        - "Bright = warmer in the afternoon: mainly slopes facing the Sun and dark, low-albedo ground."
        - "Dark = cooler: slopes facing away from the Sun, shadows, bright dusty ground."
        - "Relative values only: the mosaic is contrast-stretched per image, it is NOT a temperature in kelvin."
        - "No data poleward of ±65° latitude."
      sources:
        - { name: "NASA Mars Trek product: MO THEMIS-IR Day, Global Mosaic (2018 controlled release)", url: "https://trek.nasa.gov/mars/" }
        - { name: "Edwards et al. (2011), THEMIS global mosaics, JGR 116, E10008", url: "https://doi.org/10.1029/2010JE003755" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/THEMIS_DayIR_ControlledMosaics_100m_v2_oct2018/1.0.0/default/default028mm/{z}/{y}/{x}.png"

  - id: themis_night_ir
    name: "Thermal IR, night-time (THEMIS, 100 m)"
    description: >-
      Night-time thermal-infrared mosaic from THEMIS (Mars Odyssey),
      ~100 m/pixel, 65°S-65°N. At night, warm = ground that stores heat
      (rock, bedrock, cemented soil); cold = fine dust and sand. Has some
      gaps (transparent).
    group: overlay
    category: thermal
    resolution_m: 100
    coverage: { south: -65, west: -180, north: 65, east: 180 }
    format: png
    tile_size: 256
    levels: { min: 0, max: 9 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 1.0
    z_index: 21
    attribution: "THEMIS Night IR: NASA/JPL/ASU (Edwards et al. 2011; USGS 2018 controlled mosaic) · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Relative night-time surface temperature"
      quantitative: false
      min_label: "Colder: dust, fine sand (low thermal inertia)"
      max_label: "Warmer: rock, bedrock, crusts (high thermal inertia)"
      stops:
        - { color: "#101010" }
        - { color: "#808080" }
        - { color: "#f5f5f5" }
      notes:
        - "Bright = stays warm at night = high thermal inertia: rocky or bedrock surfaces (firmer footing)."
        - "Dark = cools fast = low thermal inertia: loose dust or fine sand (possible soft ground)."
        - "Relative values only, not kelvin. Transparent areas = no data; nothing poleward of ±65°."
      sources:
        - { name: "NASA Mars Trek product: MO THEMIS-IR Night, Global Mosaic (2018 controlled release)", url: "https://trek.nasa.gov/mars/" }
        - { name: "Edwards et al. (2011), THEMIS global mosaics, JGR 116, E10008", url: "https://doi.org/10.1029/2010JE003755" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/THEMIS_NightIR_ControlledMosaics_100m_v2_oct2018/1.0.0/default/default028mm/{z}/{y}/{x}.png"

  - id: tes_thermal_inertia
    name: "Thermal inertia (TES, ~3 km)"
    description: >-
      Global thermal inertia from the Thermal Emission Spectrometer
      (Mars Global Surveyor), 20 pixels/degree (~3 km). How well the
      ground stores heat: low = dust/fine sand, high = rock/bedrock/ice.
    group: overlay
    category: thermal
    resolution_m: 3000
    format: png
    tile_size: 256
    levels: { min: 0, max: 1 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.75
    z_index: 22
    attribution: "TES thermal inertia: NASA/JPL/ASU (Putzig et al. 2005) · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Thermal inertia"
      units: "J m⁻² K⁻¹ s⁻½"
      quantitative: false
      min_label: "Low: dust, fine sand"
      max_label: "High: rock, bedrock, cemented ground"
      stops:
        - { color: "#5000d1" }
        - { color: "#2c49ed" }
        - { color: "#28c8ff" }
        - { color: "#00cc4f" }
        - { color: "#9fef00" }
        - { color: "#ffff00" }
        - { color: "#ff8700" }
        - { color: "#ff3127" }
      notes:
        - "Blue/purple = low (dust-mantled regions such as Tharsis, Arabia, Elysium); red = high."
        - "The colour direction was checked against those known low-inertia regions; numeric stops are not published with the tiles (typical Mars range ≈ 20-800 units)."
        - "Coarse: one value every ~3 km. Transparent = no data."
      sources:
        - { name: "NASA Mars Trek product: MGS TES, Global Thermal Inertia", url: "https://trek.nasa.gov/mars/" }
        - { name: "Putzig et al. (2005), Icarus 173, 325-341", url: "https://doi.org/10.1016/j.icarus.2004.08.017" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/TES_Thermal_Inertia/1.0.0/default/default028mm/{z}/{y}/{x}.png"

  # -------------------------------------------------------------------
  # SURFACE PROPERTIES (dust, brightness, roughness)
  # -------------------------------------------------------------------
  - id: tes_albedo
    name: "Surface albedo (TES, ~7.4 km)"
    description: >-
      Bolometric albedo (how much sunlight the surface reflects) from the
      TES visible/near-IR channel (Mars Global Surveyor). Bright regions
      are usually dust-covered; dark regions are sand and rock.
    group: overlay
    category: surface
    resolution_m: 7410
    format: png
    tile_size: 256
    levels: { min: 0, max: 1 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.75
    z_index: 30
    attribution: "TES albedo: NASA/JPL/ASU · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Surface albedo (reflectivity)"
      quantitative: false
      min_label: "Dark: sand, rock (typ. ≈ 0.1)"
      max_label: "Bright: dust, frost (typ. ≈ 0.3)"
      stops:
        - { color: "#1a1a1a" }
        - { color: "#808080" }
        - { color: "#f0f0f0" }
      notes:
        - "Bright = reflective = usually thick dust (or ice near the poles). Dark = sand, rock, less dust."
        - "Typical values are indicative; exact greyscale stretch is not published with the tiles."
      sources:
        - { name: "NASA Mars Trek product: MGS TES, Global Surface Albedo", url: "https://trek.nasa.gov/mars/" }
        - { name: "Christensen et al. (2001), TES experiment description, JGR 106(E10)", url: "https://doi.org/10.1029/2000JE001370" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_MGS_TES_Albedo_mosaic_global_7410m/1.0.0/default/default028mm/{z}/{y}/{x}.png"

  - id: tes_dust_cover_index
    name: "Dust cover index (TES, ~3.5 km)"
    description: >-
      Relative abundance of spectrally obscuring dust on the surface,
      derived from TES thermal-infrared spectra (Ruff & Christensen 2002).
      Thick dust hides the rock underneath and is a hazard for solar
      panels, seals and lungs.
    group: overlay
    category: surface
    resolution_m: 3500
    format: png
    tile_size: 256
    levels: { min: 0, max: 2 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.75
    z_index: 31
    attribution: "TES dust cover index: NASA/JPL/ASU (Ruff & Christensen 2002) · via NASA Mars Trek"
    legend:
      type: gradient
      title: "Surface dust cover"
      quantitative: false
      min_label: "Little dust"
      max_label: "Thick dust"
      stops:
        - { color: "#5136ff" }
        - { color: "#2d9ced" }
        - { color: "#36bfcb" }
        - { color: "#49f48f" }
        - { color: "#aaf33e" }
        - { color: "#f0ca39" }
        - { color: "#fd822d" }
        - { color: "#e26048" }
      notes:
        - "Warm colours = dusty (e.g. Tharsis, Arabia, Elysium); cool colours = little dust (e.g. Syrtis Major, Acidalia)."
        - "Colour direction inferred by comparing with those well-known dusty / dust-poor regions; the numeric index (emissivity-based) is not published with the tiles."
      sources:
        - { name: "NASA Mars Trek product: MGS TES, Global Dust Index", url: "https://trek.nasa.gov/mars/" }
        - { name: "Ruff & Christensen (2002), JGR 107(E12), 5127", url: "https://doi.org/10.1029/2001JE001580" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/tes_ruffdust/1.0.0/default/default028mm/{z}/{y}/{x}.png"

  - id: mola_roughness
    name: "Surface roughness (MOLA, ~7.5 km)"
    description: >-
      Kilometre-scale terrain roughness from MOLA altimetry (Kreslavsky &
      Head 2000), as an RGB composite of three baselines. Brighter = rougher
      ground (harder to traverse and to land on).
    group: overlay
    category: surface
    resolution_m: 7500
    format: png
    tile_size: 256
    levels: { min: 0, max: 1 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.8
    z_index: 32
    attribution: "MOLA roughness: NASA/GSFC (Kreslavsky & Head 2000) · via NASA Mars Trek"
    legend:
      type: channels
      title: "Roughness at three scales (RGB composite)"
      quantitative: false
      stops:
        - { color: "#ff3030", label: "Red: roughness over 9.2 km" }
        - { color: "#30d030", label: "Green: roughness over 2.4 km" }
        - { color: "#3070ff", label: "Blue: roughness over 0.6 km" }
      notes:
        - "Overall brightness = overall roughness (dark = smooth plains, good for landing)."
        - "Hue = at which scale it is rough: bluish = rough at short (0.6 km) scale; reddish = rough only at long (9.2 km) scale."
        - "Very coarse (8 pixels/degree): a regional guide, not a footpath planner."
      sources:
        - { name: "NASA Mars Trek product: MGS MOLA, Global Surface Roughness", url: "https://trek.nasa.gov/mars/" }
        - { name: "Kreslavsky & Head (2000), JGR 105(E11), 26695-26711", url: "https://doi.org/10.1029/2000JE001259" }
    source:
      url_template: "https://trek.nasa.gov/tiles/Mars/EQ/mola_roughness/1.0.0/default/default028mm/{z}/{y}/{x}.png"

  # -------------------------------------------------------------------
  # COMPOSITION (TES mineral abundance maps, Bandfield 2002)
  # -------------------------------------------------------------------
  - id: tes_high_ca_pyroxene
    name: "High-Ca pyroxene abundance (TES)"
    description: >-
      Concentration of high-calcium pyroxene (a basalt mineral) from TES spectra deconvolution, 4 pixels/degree. Highest in Syrtis Major and other dark equatorial regions.
    group: overlay
    category: composition
    resolution_m: 16000
    format: png
    tile_size: 256
    levels: { min: 0, max: 1 }
    display: { min_zoom: 0, max_zoom: 18 }
    opacity: 0.7
    z_index: 40
    attribution: "TES mineral maps: NASA/JPL/ASU (Bandfield 2002) · via NASA Mars Trek"
    legend:
      type: gradient
      title: "High-Ca pyroxene (areal fraction)"
      quantitative: false
      min_label: "Low (≈ 0)"
      max_label: "High (≈ 0.20)"
      stops:
        - { color: "#5000d1" }
        - { color: "#2c49ed" }
        - { color: "#1eb9e1" }
        - { color: "#21d578" }
        - { color: "#93e017" }
        - { color: "#f4cf00" }
        - { color: "#ff8d01" }
        - { color: "#ff200c" }
      notes:
